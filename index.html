<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DIRTT nav prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- ?v= forces browsers to fetch fresh copies after an update; bump it on each push -->
    <link rel="stylesheet" href="css/tokens.css?v=2" />
    <link rel="stylesheet" href="css/components.css?v=2" />
    <link rel="stylesheet" href="css/patterns.css?v=2" />
  </head>
  <body>
    <div id="header-mount"></div>

    <main class="page">
      <section class="page-intro">
        <h1 id="pattern-name"></h1>
        <p id="pattern-desc"></p>
      </section>
      <div class="ph ph-hero"></div>
      <div class="ph-grid">
        <div class="ph"></div>
        <div class="ph"></div>
        <div class="ph"></div>
      </div>
    </main>

    <div id="footer-mount"></div>

    <div class="switcher" role="group" aria-label="Navigation pattern"></div>

    <script src="js/nav-data.js?v=2"></script>
    <script src="js/nav.js?v=2"></script>
  </body>
</html>
